[workspace]
name = "antigravity-mcp"
version = "1.0.2"
description = "Antigravity MCP Orchestrator Server for Google Gemini & Antigravity IDE"
authors = ["Haider"]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[dependencies]
python = ">=3.10"
hatchling = ">=1.32.4,<2"
twine = ">=7.0.0,<8"
python-build = ">=1.6.1,<2"

[tasks]
server = "python3 server.py"
tunnel = "python3 server.py --tunnel"
test = "python3 test_mcp.py"
test-http = "python3 test_http_mcp.py"
start = "./start_daemon.sh"
stop = "./stop_daemon.sh"
status = "./status.sh"
